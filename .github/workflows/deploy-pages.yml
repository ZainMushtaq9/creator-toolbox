name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: Run unit, security, SEO and backend tests
        run: npm test && npm run test:backend
      - name: Build frontend for the Pages subpath
        run: npm --prefix frontend run build
        env:
          PAGES_BASE_PATH: /creator-toolbox/
      - name: Add SPA fallback and disable Jekyll
        run: cp frontend/dist/index.html frontend/dist/404.html && touch frontend/dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
