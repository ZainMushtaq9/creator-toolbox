<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="CreatorToolbox — free online tools for YouTube, Instagram, TikTok, images and text. No sign-up, most tools run in your browser." />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set the theme before first paint to avoid a light/dark flash.
      // Saved choice wins; otherwise follow the system preference.
      try {
        var t = localStorage.getItem("ct-theme");
        if (t !== "dark" && t !== "light") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    </script>
    <title>CreatorToolbox | Free Tools. Smarter Creation.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
